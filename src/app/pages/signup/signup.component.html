<app-default-login-layout 
    title="Sign in and start today"
    primaryBtnTxt="Sign Up Now"
    secondaryBtnTxt="Login Now"
    (submit)="submit()"
    (navigate)="navigate()">
    <form [formGroup]="signupForm">
        <app-primary-input
        formControlName="name" inputName="name" type="text" label="Name" placeholder="John Doe">
        </app-primary-input>
        <app-primary-input
        formControlName="email" inputName="email" type="email" label="Email" placeholder="johndoe@gmail.com">
        </app-primary-input>
        <app-primary-input
        formControlName="password" inputName="password" type="password" label="Your password" placeholder="*************">
        </app-primary-input>
        <app-primary-input
        formControlName="passwordConfirm" inputName="passwordConfirm" type="password" label="Confirm your password" placeholder="*************">
        </app-primary-input>
    </form>
</app-default-login-layout>
