<app-default-login-layout 
    title="Login into your account"
    primaryBtnTxt="Login Now"
    secondaryBtnTxt="Sign Up Now"
    (submit)="submit()"
    (navigate)="navigate()">
    <form [formGroup]="loginForm">
        <app-primary-input
        formControlName="email" inputName="email" type="email" label="Email" placeholder="johndoe@gmail.com">
        </app-primary-input>
        <app-primary-input
        formControlName="password" inputName="password" type="password" label="Your password" placeholder="*************">
        </app-primary-input>
        <span>forgot password?</span>
    </form>
</app-default-login-layout>
